name: Tests and PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: transactionshield_test_ci
          POSTGRES_USER: postgres
          # Disposable CI service only; not a deployed database credential.
          POSTGRES_PASSWORD: ci_only_dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transactionshield_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRANSACTIONSHIELD_TEST_DATABASE_DSN: postgresql://postgres:ci_only_dummy@localhost:5432/transactionshield_test_ci
      LOKY_MAX_CPU_COUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all test dependencies
        run: python -m pip install -e ".[dev,postgres,modelling]"
      - name: Ordinary unit and contract tests
        run: python -m pytest -m "not postgres"
      - name: Full suite including real PostgreSQL
        run: python -m pytest --junitxml=artifacts/ci-tests.xml
      - name: Require five executed PostgreSQL tests and no skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('artifacts/ci-tests.xml').findall('.//testcase')
          postgres = [c for c in cases if c.attrib['classname'] == 'tests.test_postgres_integration']
          assert len(postgres) == 5, 'Expected the five genuine PostgreSQL tests'
          assert not any(c.find('skipped') is not None for c in cases), 'Skipped tests are not CI verification'
          for case in postgres:
              assert not list(case), f"PostgreSQL test did not pass: {case.attrib['name']}"
              print('VERIFIED IN CI:', case.attrib['name'])
          PY
      - name: Python compile and whitespace checks
        run: |
          python -m compileall -q src tests
          git diff --check
