[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "transactionshield"
version = "0.1.0"
description = "Leakage-safe fraud modelling and transaction data pipeline portfolio project."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
transactionshield-audit = "transactionshield.audit:main"
transactionshield-contract = "transactionshield.contracts:main"
transactionshield-canonical = "transactionshield.pipeline:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
modelling = ["scikit-learn==1.8.0", "numpy==2.3.5", "scipy==1.17.0", "joblib==1.5.3", "threadpoolctl==3.6.0"]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires an explicitly configured disposable PostgreSQL test database"]
